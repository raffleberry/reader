name: release

# Builds the extension zips + helper binaries for the pushed commit and
# attaches them to a *draft* release. Nothing here mutates git state:
# no `git tag`, no `git push`, no release deletion. The commit's short
# hash is the only version identifier (draft tag `build-<sha>`).
#
# act (https://github.com/nektos/act) support:
# - everything runs on ubuntu-latest (act has no Windows runners), the
#   Windows helper is cross-compiled from Linux (pure Go, CGO off);
# - checkout is shallow with no `git fetch --tags` (works offline);
# - steps needing the GitHub API or the artifact server are skipped
#   under act (`if: ${{ !env.ACT }}`); the builds themselves still run,
#   so `act push` / `act -j build` verifies the artifacts locally.
# - `workflow_dispatch` exists so `act -j build` can run without a push.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Shallow is enough: the short hash comes from the local HEAD,
          # no tag history is consulted.
          fetch-depth: 1

      - id: sha
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "short hash: $short"

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so releases build with a known-good toolchain instead
          # of whatever `latest` happens to be that day.
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
        working-directory: extension

      # `wxt zip` only packages existing build output, so build first:
      # zipping without building can sail through with no zips at all.
      - run: bun run build
        working-directory: extension
      - run: bun run build:firefox
        working-directory: extension
      - run: bun run zip
        working-directory: extension
      - run: bun run zip:firefox
        working-directory: extension

      # Prove the zips exist (runs everywhere, including under act):
      # if this fails, the path is wrong — not the uploader.
      - run: ls -la extension/.output/ && ls extension/.output/*.zip

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # The helper is pure Go, so both binaries cross-compile from Linux.
      # (One runner keeps this runnable under act, which has no Windows
      # runners.) The build itself is the gate — if it compiles, it ships.
      - run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -o ../dist/reader-${{ steps.sha.outputs.short }}-linux-amd64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o ../dist/reader-${{ steps.sha.outputs.short }}-windows-amd64.exe .
          ls -la ../dist/
        working-directory: tts

      - run: ls -R extension/.output dist

      # Visible in the Actions UI. Skipped under act: without an artifact
      # server this fails, and the files are already on local disk.
      - uses: actions/upload-artifact@v6
        if: ${{ !env.ACT }}
        with:
          name: build-${{ steps.sha.outputs.short }}
          path: |
            extension/.output/*.zip
            dist/reader-*
          # The default (`warn`) once let a build with no zips sail
          # through to a helper-only release. Fail instead.
          if-no-files-found: error

      # Draft release keyed by commit hash. Creates the `build-<sha>` tag
      # via the API (no local git mutation). Skipped under act: offline
      # there is no API to talk to; re-runs on the same commit update
      # the same draft.
      - uses: softprops/action-gh-release@v3
        if: ${{ !env.ACT }}
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ steps.sha.outputs.short }}
          draft: true
          prerelease: false
          generate_release_notes: true
          # Explicit patterns, not a bare `*`: with
          # `fail_on_unmatched_files` the publish fails instead of
          # shipping a release missing the extension or the helper.
          files: |
            extension/.output/*.zip
            dist/reader-*
          fail_on_unmatched_files: true
