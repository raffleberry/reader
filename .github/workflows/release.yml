name: release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          set -euo pipefail
          git fetch --tags
          ver=$(jq -r .version extension/package.json)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "extension/package.json version is not X.Y.Z: '$ver'" >&2
            exit 1
          fi
          tag="v$ver"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists: bump extension/package.json first" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git tag "$tag"
          git push origin "$tag"

  # The extension, for the Chrome Web Store, Edge and Firefox Add-ons.
  extension:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: extension
      - run: bun run test
        working-directory: extension
      - run: bun run zip
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/.output/*.zip

  # The speech helper, as a self-contained binary (pure Go, no CGO).
  helper:
    needs: tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            suffix: ""
          - os: windows-latest
            goos: windows
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./... && go test ./...
        working-directory: tts
      - run: go build -o reader-${{ matrix.goos }}-amd64${{ matrix.suffix }} .
        working-directory: tts
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.goos }}-${{ needs.tag.outputs.tag }}
          path: tts/reader-*

  publish:
    needs: [tag, extension, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          target_commitish: release
          generate_release_notes: true
          files: artifacts/*
      - run: |
          set -euo pipefail
          mapfile -t old < <(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+(\.[0-9]+\.[0-9]+)?$' | sort -V | head -n -5 || true)
          for t in ${old[@]:-}; do
            echo "deleting old release $t"
            gh release delete "$t" --cleanup-tag --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
