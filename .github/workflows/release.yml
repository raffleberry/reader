name: release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        run: |
          set -euo pipefail
          git fetch --tags
          ver=$(jq -r .version extension/package.json)
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "extension/package.json version is not X.Y.Z: '$ver'" >&2
            exit 1
          fi
          tag="v$ver"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists: bump extension/package.json first" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git tag "$tag"
          git push origin "$tag"

  # The extension, for the Chrome Web Store, Edge and Firefox Add-ons.
  extension:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so releases build with a known-good toolchain instead
          # of whatever `latest` happens to be that day.
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: extension
      # No unit tests here on purpose: releases just build and publish
      # (extension tests still run via `just check`). An explicit build
      # comes first: `wxt zip` only packages existing build output, so
      # zipping without building can sail through with no zips at all
      # (v1.0.2 shipped helper-only that way).
      - run: bun run build
        working-directory: extension
      - run: bun run build:firefox
        working-directory: extension
      - run: bun run zip
        working-directory: extension
      - run: bun run zip:firefox
        working-directory: extension
      # Prove the zips are visible at the repo-root-relative path the
      # upload step uses (no working-directory here on purpose): if this
      # fails, the path is wrong — not the uploader.
      - run: ls -la extension/.output/ && ls extension/.output/*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: extension
          path: extension/.output/*.zip
          # The default (`warn`) once let a build with no zips sail
          # through to a helper-only release. Fail instead.
          if-no-files-found: error

  # The speech helper, as a self-contained binary (pure Go, no CGO).
  helper:
    needs: tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            suffix: ""
          - os: windows-latest
            goos: windows
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      # No vet/test here on purpose: releases just build and publish
      # (helper tests still run via `just check`). The build itself
      # is the gate — if it compiles, it ships.
      - run: go build -o reader-${{ matrix.goos }}-amd64${{ matrix.suffix }} .
        working-directory: tts
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v6
        with:
          name: helper-${{ matrix.goos }}-${{ needs.tag.outputs.tag }}
          path: tts/reader-*

  publish:
    needs: [tag, extension, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          target_commitish: release
          generate_release_notes: true
          # Explicit patterns, not a bare `*`: with
          # `fail_on_unmatched_files` the publish fails instead of
          # shipping a release missing the extension or the helper.
          files: |
            artifacts/*.zip
            artifacts/reader-*
          fail_on_unmatched_files: true
      - run: |
          set -euo pipefail
          mapfile -t old < <(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+(\.[0-9]+\.[0-9]+)?$' | sort -V | head -n -5 || true)
          for t in ${old[@]:-}; do
            echo "deleting old release $t"
            gh release delete "$t" --cleanup-tag --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
