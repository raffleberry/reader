[project]
name = "reader"
version = "1.0.0"
description = "Local speech server for the Reader browser extension."
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
  "aiohttp>=3.9",
  "edge-tts>=7.0.0",
  "platformdirs>=4.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
packaging = ["pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["reader.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
