[project]
name = "reader"
version = "0.1.0"
description = "Local web app to read EPUB files aloud with word-level highlighting."
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
  "aiohttp>=3.9",
  "edge-tts>=7.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
